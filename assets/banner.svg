<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">InstaBOT Backend Automation Platform</title>
  <desc id="desc">A dark backend engineering banner showing an API request flowing through a bot service to a database.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f77737"/>
      <stop offset="0.45" stop-color="#e1306c"/>
      <stop offset="1" stop-color="#833ab4"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#334155" stroke-opacity=".22"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#background)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#334155" stroke-width="2"/>
  <rect y="312" width="1200" height="8" rx="4" fill="url(#accent)"/>

  <!-- Backend service identity -->
  <g transform="translate(62 60)">
    <rect width="70" height="70" rx="18" fill="url(#accent)"/>
    <path d="M18 30h34M18 40h34M18 50h34" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="25" cy="30" r="2.5" fill="#fff"/><circle cx="25" cy="40" r="2.5" fill="#fff"/><circle cx="25" cy="50" r="2.5" fill="#fff"/>
  </g>
  <text x="62" y="174" class="sans" font-size="53" font-weight="800" fill="#f8fafc">Insta<tspan fill="url(#accent)">BOT</tspan></text>
  <text x="65" y="208" class="sans" font-size="19" fill="#cbd5e1">Reliable Instagram automation, built like a backend.</text>

  <!-- Feature pills -->
  <g class="mono" font-size="12.5">
    <rect x="64" y="239" width="116" height="30" rx="15" fill="#172033" stroke="#334155"/>
    <text x="82" y="259" fill="#67e8f9">REST API</text>
    <rect x="190" y="239" width="140" height="30" rx="15" fill="#172033" stroke="#334155"/>
    <text x="207" y="259" fill="#86efac">EVENT DRIVEN</text>
    <rect x="340" y="239" width="128" height="30" rx="15" fill="#172033" stroke="#334155"/>
    <text x="357" y="259" fill="#fbbf24">MULTI ADMIN</text>
  </g>

  <!-- Request pipeline -->
  <g transform="translate(590 42)">
    <rect width="548" height="228" rx="16" fill="#0b1220" fill-opacity=".88" stroke="#334155"/>
    <circle cx="22" cy="22" r="5" fill="#fb7185"/><circle cx="40" cy="22" r="5" fill="#fbbf24"/><circle cx="58" cy="22" r="5" fill="#4ade80"/>
    <text x="82" y="27" class="mono" font-size="12" fill="#64748b">instabot / backend pipeline</text>

    <g transform="translate(26 58)">
      <rect width="116" height="82" rx="12" fill="#111c31" stroke="#38bdf8"/>
      <text x="19" y="27" class="mono" font-size="12" fill="#67e8f9">REQUEST</text>
      <text x="19" y="51" class="mono" font-size="14" fill="#e2e8f0">Webhook</text>
      <text x="19" y="69" class="mono" font-size="11" fill="#94a3b8">/message</text>
    </g>
    <path d="M151 99h39" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)" filter="url(#glow)"/>
    <g transform="translate(190 58)">
      <rect width="140" height="82" rx="12" fill="#17152d" stroke="#c084fc"/>
      <text x="18" y="27" class="mono" font-size="12" fill="#d8b4fe">PROCESSOR</text>
      <text x="18" y="51" class="mono" font-size="14" fill="#f8fafc">InstaBOT</text>
      <text x="18" y="69" class="mono" font-size="11" fill="#a78bfa">onReply()</text>
    </g>
    <path d="M339 99h39" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)" filter="url(#glow)"/>
    <g transform="translate(378 58)">
      <rect width="142" height="82" rx="12" fill="#10251f" stroke="#4ade80"/>
      <text x="18" y="27" class="mono" font-size="12" fill="#86efac">PERSISTENCE</text>
      <text x="18" y="51" class="mono" font-size="14" fill="#f8fafc">Queue + DB</text>
      <text x="18" y="69" class="mono" font-size="11" fill="#4ade80">retry-safe</text>
    </g>
    <path d="M26 174h494" stroke="#1e293b"/>
    <text x="26" y="199" class="mono" font-size="12" fill="#94a3b8">status: <tspan fill="#4ade80">● online</tspan>   latency: <tspan fill="#fbbf24">42ms</tspan>   tests: <tspan fill="#67e8f9">passing</tspan></text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e8f9"/>
    </marker>
  </defs>
</svg>
